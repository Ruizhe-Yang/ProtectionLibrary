name: Publish reviewed learning guide
on:
  push:
    branches: [docs/bilingual-guides-20261112]
    paths: [.github/workflows/publish-learning-guide.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate the reviewed HTML and commit documentation only
        shell: bash
        env:
          BUILDER: 86e31b71c82eb25dac7ded13c4e63eee58f7c17c
          GUIDE_HASH: 45b2a3dd334a4f71c90b760de451931ab8bca1de200ab76681e354f05ea78519
        run: |
          set -euo pipefail
          build="${RUNNER_TEMP}/guide-builder"
          mkdir -p "$build"
          for name in build_guides titles lesson_helpers lesson_mslfaults lesson_anomaly lesson_protection lesson_scenario lesson_uncertainty lesson_evaluation lessons patch_renderer refinements publish; do
            curl --fail --silent --show-error --retry 2 "https://raw.githubusercontent.com/Ruizhe-Yang/EvaluationLibrary/${BUILDER}/.guide-build/${name}.py" -o "$build/${name}.py"
          done
          python "$build/patch_renderer.py"
          python "$build/publish.py" --repo ProtectionLibrary --expected-hash "$GUIDE_HASH" --report "${RUNNER_TEMP}/guide-publication.json"
      - uses: actions/upload-artifact@v4
        with:
          name: guide-publication
          path: ${{ runner.temp }}/guide-publication.json
          retention-days: 2
