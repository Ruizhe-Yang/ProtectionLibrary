ext><path d="M 812 160 H 849" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1031 160 H 1067" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1037" y="265" width="175" height="58" rx="12" fill="white" stroke="#d8e0e4" stroke-width="1.5"/><text x="1124.5" y="300.0" font-size="18" font-weight="600" fill="#172b42" text-anchor="middle">Host model</text><path d="M 1140 198 V 265" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="778" y="265" width="221" height="58" rx="12" fill="white" stroke="#d8e0e4" stroke-width="1.5"/><text x="888.5" y="300.0" font-size="17" font-weight="600" fill="#172b42" text-anchor="middle">Measured feedback</text><path d="M 1037 294 H 999" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M 778 294 H 730 V 198" fill="none" stroke="#738495" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="642" y="369" font-size="13.5" font-weight="400" fill="#526477" text-anchor="start">Conceptual loop · dashed line: measured-state feedback</text>
