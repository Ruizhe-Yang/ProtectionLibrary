<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
<title id="title">ProtectionLibrary</title>
<desc id="desc">Criteria feed voting or coordination logic and an action sent to the host model. A separate dashed path returns measured feedback. The diagram depicts the logic structure, not a guarantee of successful protection.</desc>
